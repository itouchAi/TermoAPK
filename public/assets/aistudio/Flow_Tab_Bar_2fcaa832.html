<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flow Tab Bar — liquid glass navigation</title>
<meta name="description" content="A dark glass tab bar whose active tab is a bead of liquid glass.">
<style>
:root{--page:#040406;--ink:#fff;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--page)}
body{position:fixed;inset:0;font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#gl{position:fixed;left:0;top:0;width:100vw;height:100vh}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1080px;transform:translate(-50%,-50%)}
.icon{position:absolute;left:0;top:0;width:44px;height:44px;color:var(--ink);will-change:transform,opacity}
.icon svg{width:44px;height:44px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.label{position:absolute;left:0;top:0;width:120px;text-align:center;font:500 14px "Geist",system-ui,sans-serif;color:var(--ink);will-change:transform,opacity,filter}
.tab{position:absolute;top:538px;width:150px;height:124px;border:0;border-radius:46px;background:transparent;color:transparent;cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
.tab:focus-visible{box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
</style>
</head>
<body>
<canvas id="gl" role="img" aria-label="A dark frosted-glass tab bar on a near-black page. The active tab is a bead of liquid glass that bulges above the bar with a coloured light inside it; between tabs the bead sinks into the bar, travels under the glass as a low wave and resurfaces at the next tab."></canvas>
<div id="stage"></div>
<script>
const TABS=["Home","Search","Insights","Activity","Profile"];
const XS=[240,390,540,690,840],BY=600,LOOP=8;
const d="pathLength=\"1\" class=\"d\"";
const ICONS=[
`<svg viewBox="0 0 44 44"><path d="M10 34V20a12 12 0 0 1 24 0v14" ${d}/><path d="M22 34v-8" ${d}/></svg>`,
`<svg viewBox="0 0 44 44"><circle cx="20" cy="20" r="11" ${d}/><circle cx="34" cy="34" r="2" fill="currentColor" stroke="none"/></svg>`,
`<svg viewBox="0 0 44 44"><path d="M22 10a12 12 0 1 0 12 12" ${d}/><path d="M26 8a10 10 0 0 1 10 10H26z" ${d}/></svg>`,
`<svg viewBox="0 0 44 44"><path d="M10 22a12 12 0 1 1 12 12" ${d}/><path d="M22 15v7l5 4" ${d}/><circle cx="12" cy="32" r="2" fill="currentColor" stroke="none"/></svg>`,
`<svg viewBox="0 0 44 44"><circle cx="22" cy="15" r="6" ${d}/><path d="M10 35a12 12 0 0 1 24 0" ${d}/></svg>`];
const stage=document.getElementById("stage"),canvas=document.getElementById("gl");
const labels=TABS.map(n=>{const e=document.createElement("div");e.className="label";e.setAttribute("aria-hidden","true");e.textContent=n;stage.append(e);return e});
const icons=ICONS.map(s=>{const e=document.createElement("div");e.className="icon";e.setAttribute("aria-hidden","true");e.innerHTML=s;stage.append(e);return e});
const nav=document.createElement("nav");nav.setAttribute("aria-label","Tabs");stage.append(nav);
const buttons=TABS.map((n,i)=>{const b=document.createElement("button");b.className="tab";b.type="button";b.style.left=(XS[i]-75)+"px";b.textContent=n;nav.append(b);return b});
const strokes=icons.map(el=>[...el.querySelectorAll(".d")]);

// ---- math + timeline
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),lerp=(a,b,u)=>a+(b-a)*u;
const eOut=u=>1-Math.pow(1-clamp(u),5);
const eIO=u=>{u=clamp(u);return u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2};
const ACC=[[.55,.4,1],[.2,.75,1],[1,.62,.2],[1,.32,.6],[.3,1,.7]];
const MOV=[{ts:.8,a:0,b:1,d:.7},{ts:2.3,a:1,b:3,d:.9},{ts:3.9,a:3,b:2,d:.7},{ts:5.3,a:2,b:4,d:.9},{ts:6.8,a:4,b:0,d:1}];
const moveLength=n=>n<=1?.7:n<=3?.9:1;
function state(t,moves=MOV){
 let x=XS[0],rise=1,sx=1,acc=ACC[0],tap=[0,-1],sw=0,cur=0,draw=1;
 for(const{ts,a,b,d}of moves){
  if(t<ts)break;
  const u=eIO((t-ts)/d),k=clamp((t-ts)/d);
  x=lerp(XS[a],XS[b],u);
  const dive=Math.sin(Math.PI*Math.min(1,k*1.08));
  rise=1-.9*Math.pow(dive,.7);
  if(k>=1)rise=1+.06*Math.exp(-(t-ts-d)*9)*Math.sin((t-ts-d)*22);
  sx=1+.55*Math.sin(Math.PI*k)*(Math.abs(b-a)>1?1.25:1);
  acc=ACC[a].map((v,i)=>lerp(v,ACC[b][i],u));
  tap=[XS[b],t-ts];
  sw=clamp((t-ts-d*.9)/.9);
  cur=b;
  draw=k<.5?1-eIO((k-.25)/.25):eOut((t-ts-d*.5)/.6);
 }
 return{x,rise,sx,acc,tap,sw,cur,draw};
}

// ---- shader (verbatim)
const VS=`#version 300 es
in vec2 a;void main(){gl_Position=vec4(a,0.,1.);}`;
const FS=`#version 300 es
precision highp float;
uniform vec2 uRes;uniform float uDpr,uT;uniform vec3 uView,uB,uAcc,uTap;uniform float uSw;
out vec4 o;
const float TAU=6.2831853;
float sq(float x){return x*x;}
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+1.),f.x),f.y);}
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<4;i++){s+=a*noise(p);p=mat2(1.6,1.2,-1.2,1.6)*p+7.1;a*=.5;}return s;}
float sdBox(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,q.y),0.)-r;}
float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
vec2 bead(){return vec2(uB.x,572.-uB.y*46.);}
float shape(vec2 p){
 float bar=sdBox(p-vec2(540.,600.),vec2(404.,62.),46.);
 vec2 q=p-bead();float sx=uB.z;q.x/=sx;q.y*=mix(1.,sx,.35);
 float bd=(length(q)-46.)*min(1.,1./mix(1.,sx,.35));
 return smin(bar,bd,38.);}
vec3 bg(vec2 p){
 float ph=TAU*uT/8.;
 vec3 c=vec3(.012,.012,.018);
 vec2 u=p/1080.;
 float n=fbm(u*2.2+vec2(cos(ph),sin(ph))*.18);
 c+=vec3(.05,.06,.11)*smoothstep(.35,.85,n)*.7;
 vec2 d=p-vec2(uB.x,650.);
 c+=uAcc*exp(-dot(d*vec2(1.,1.5),d*vec2(1.,1.5))/(2.*230.*230.))*.42;
 vec2 d2=p-vec2(1080.-uB.x,430.);
 c+=uAcc.zxy*exp(-dot(d2,d2)/(2.*300.*300.))*.1;
 return c;}
void main(){
 vec2 p=(vec2(gl_FragCoord.x,uRes.y-gl_FragCoord.y)/uDpr-uView.xy)/uView.z+vec2(540.);
 float d=shape(p);float e=1.5;
 vec2 g=vec2(shape(p+vec2(e,0.))-d,shape(p+vec2(0.,e))-d)/e;
 float inM=smoothstep(.8,-.8,d);
 vec3 col=bg(p);
 col*=1.-.5*exp(-max(d,0.)/34.)*(1.-inM)*smoothstep(520.,640.,p.y+40.);
 if(inM>0.){
  float edge=exp(d/15.);
  vec2 off=-g*edge*46.;
  vec3 fr=vec3(0.);
  for(int i=0;i<4;i++){float an=float(i)*1.5708+.6;fr+=bg(p+off+vec2(cos(an),sin(an))*40.);}
  fr*=.25;
  vec3 glass=fr*.5+vec3(.03,.03,.04);
  glass+=fr*edge*.4;
  // light source living inside the glass, travelling with the active tab
  vec2 b=bead();vec2 q=p-vec2(b.x,b.y+10.);
  float l=length(q*vec2(1./uB.z,1.15));
  glass+=uAcc*(exp(-l/78.)*.5+exp(-l/26.)*.55*uB.y)+vec3(1.)*exp(-l/12.)*.12*uB.y;
  // tap ripple
  float r=length(p-vec2(uTap.x,600.));
  glass+=(uAcc*.6+.2)*exp(-sq((r-20.-uTap.y*90.)/3.))*max(0.,1.-uTap.y/.45)*.22*step(0.,uTap.y);
  // rim
  float rim=exp(-sq((d+1.3)/1.1));
  float lit=.2+.8*pow(clamp(dot(normalize(g+1e-4),normalize(vec2(-.35,-.94))),0.,1.),1.4);
  glass+=(vec3(1.)*.55+uAcc*.35)*rim*lit;
  float ang=atan(g.y,g.x);
  glass+=(.5+.5*cos(ang*2.+p.x*.006+vec3(0.,2.1,4.2)))*rim*.16;
  // one soft light sweep across the glass after each landing
  float sx=136.+808.*uSw+(p.y-600.)*.7;
  glass+=vec3(1.)*exp(-sq((p.x-sx)/46.))*sin(3.14159*uSw)*.06;
  glass+=vec3(1.)*.05*smoothstep(-30.,-4.,d)*clamp((600.-p.y)/62.,0.,1.);
  // small specular on the bead cap
  vec2 s=p-(b+vec2(-14.,-20.)*uB.y);
  glass+=vec3(1.)*exp(-dot(s*vec2(.6,1.4),s*vec2(.6,1.4))/60.)*.22*uB.y;
  glass+=(h21(p)-.5)*.012;
  col=mix(col,glass,inM);
 }
 col*=1.-.35*smoothstep(420.,900.,length(p-vec2(540.)));
 col=1.-exp(-col*1.25);
 col+=(h21(p+fract(uT*7.))-.5)/255.;
 o=vec4(col,1.);}`;

// ---- scene
const gl=canvas.getContext("webgl2",{antialias:false,preserveDrawingBuffer:true});
let layout=()=>{},draw=()=>{};
if(!gl){console.error("WebGL2 isn't available here.")}
else{
 const DPR=Math.min(2,devicePixelRatio||1);let VW=1080,VH=1080,VSC=1;
 const sh=(t,s)=>{const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(x));return x};
 const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
 gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
 gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
 const al=gl.getAttribLocation(pr,"a");gl.enableVertexAttribArray(al);gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
 const U={};["uRes","uDpr","uT","uView","uB","uAcc","uTap","uSw"].forEach(n=>U[n]=gl.getUniformLocation(pr,n));
 layout=(w,h,k)=>{VW=w;VH=h;VSC=k;canvas.width=Math.round(VW*DPR);canvas.height=Math.round(VH*DPR)};
 draw=(s,t)=>{
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.uniform2f(U.uRes,canvas.width,canvas.height);gl.uniform1f(U.uDpr,DPR);gl.uniform1f(U.uT,t);
  gl.uniform3f(U.uView,VW/2,VH/2,VSC);gl.uniform3f(U.uB,s.x,s.rise,s.sx);gl.uniform3fv(U.uAcc,s.acc);
  gl.uniform3f(U.uTap,s.tap[0],s.tap[1],0);gl.uniform1f(U.uSw,s.sw);
  gl.drawArrays(gl.TRIANGLES,0,3);
  icons.forEach((el,i)=>{
   const w=Math.pow(clamp(1-Math.abs(s.x-XS[i])/96),1.5),a=w*clamp(s.rise);
   el.style.transform=`translate(${XS[i]-22}px,${BY-22-72*a}px) scale(${1+.1*a})`;
   el.style.opacity=String(lerp(.34,1,clamp(a*1.3)));
   const dr=i===s.cur?s.draw:1;
   strokes[i].forEach(q=>q.style.strokeDashoffset=String(1-dr));
   const lb=labels[i],la=Math.pow(clamp((a-.55)/.45),1.5);
   lb.style.opacity=String(la*.9);
   lb.style.transform=`translate(${XS[i]-60}px,${BY-4+10*(1-la)}px)`;
   lb.style.filter=`blur(${(1-la)*5}px)`;
  });
 };
}

// ---- fit + engine
const fitScale=(w,h)=>Math.min(w/880,h/1080);
const onResize=()=>{const w=innerWidth,h=innerHeight,k=fitScale(w,h);stage.style.transform=`translate(-50%,-50%) scale(${k})`;layout(w,h,k)};
onResize();addEventListener("resize",onResize);

const wrap=t=>((t%LOOP)+LOOP)%LOOP;
const still=t=>{const u=wrap(t);draw(state(u),u)};
window.__render=still;window.__LOOP=LOOP;
if(new URLSearchParams(location.search).has("rec")){requestAnimationFrame(()=>still(0))}
else{
 const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
 let live=false,moves=[],cur=0,pending=null,shown=-1;
 const t0=performance.now()/1000;
 const active=i=>{if(i!==shown){shown=i;buttons.forEach((b,j)=>j===i?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"))}};
 const frame=()=>{
  const now=performance.now()/1000,t=wrap(now-t0);
  if(!live){const s=state(t);draw(s,t);active(s.cur)}
  else{
   const tl=now-t0,last=moves[0];
   if(pending!==null&&(!last||tl>=last.ts+last.d)){
    if(pending!==cur){moves=[{ts:tl,a:cur,b:pending,d:moveLength(Math.abs(pending-cur))}];cur=pending}
    pending=null;
   }
   draw(state(tl,moves),t);active(cur);
  }
  requestAnimationFrame(frame);
 };
 const settle=i=>{cur=i;draw(state(1000,[{ts:0,a:i,b:i,d:1}]),0);active(i)};
 const onClick=i=>{
  if(reduce)return settle(i);
  if(!live){
   live=true;
   const tl=performance.now()/1000-t0,td=wrap(tl);
   const m=[...MOV].reverse().find(q=>q.ts<=td);
   moves=m?[{...m,ts:tl-(td-m.ts)}]:[];cur=m?m.b:0;
  }
  pending=i;
 };
 buttons.forEach((b,i)=>b.addEventListener("click",()=>onClick(i)));
 if(reduce)settle(0);else requestAnimationFrame(frame);
}
</script>
</body>
</html>
