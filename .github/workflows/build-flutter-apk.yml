name: Build Termostat Flow Android APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-flutter-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Analyze & Build Release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Bootstrap Android Gradle files if missing
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create . --platforms=android
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Static analysis (flutter analyze)
        run: flutter analyze

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: termostat-flow-android-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
