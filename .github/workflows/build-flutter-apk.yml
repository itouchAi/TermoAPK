name: Build Termostat Flow Android APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-flutter-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Bootstrap Android Gradle files & preserve manifest
        run: |
          cp -f android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.bak 2>/dev/null || true
          cp -f test/widget_test.dart /tmp/widget_test.dart.bak 2>/dev/null || true

          if [ ! -f android/gradlew ]; then
            flutter create . --platforms=android
          fi

          if [ -f /tmp/AndroidManifest.xml.bak ]; then
            cp -f /tmp/AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml
          fi
          if [ -f /tmp/widget_test.dart.bak ]; then
            cp -f /tmp/widget_test.dart.bak test/widget_test.dart
          else
            rm -f test/widget_test.dart
          fi

          chmod +x android/gradlew 2>/dev/null || true

          # Eklentiler (speech_to_text, audioplayers vb.) için minSdk >= 23 garantisi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = maxOf(23, flutter.minSdkVersion)/g' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = Math.max(23, flutter.minSdkVersion)/g' android/app/build.gradle
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion Math.max(23, flutter.minSdkVersion)/g' android/app/build.gradle
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: termostat-flow-android-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
