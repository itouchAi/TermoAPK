name: termostat_flow
description: Saf Flutter ve GLSL FragmentShader tabanlı akıllı kombi ve oda termostatı Android uygulaması.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.3
  audioplayers: '>=6.1.0 <7.0.0'
  file_picker: '>=8.1.4 <11.0.0'
  screen_brightness: ^2.1.11
  wakelock_plus: ^1.2.10
  vibration: ^3.2.1
  cryptography: ^2.7.0
  http: ^1.2.2
  flutter_tts: '>=4.2.0 <5.0.0'
  speech_to_text: '>=7.0.0 <8.0.0'
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mascots/
  shaders:
    - shaders/flow_tab_bar.frag
    - shaders/boiler_flame.frag
    - shaders/thermo_liquid.frag
